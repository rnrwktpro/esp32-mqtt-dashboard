<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ESP32 상태 모니터</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
  body {
    background:#111;
    color:#0f0;
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:60px;
  }
  .online { color:#0f0; font-size:36px;  }
  .error  { color:#f00; font-weight:bold; font-size:36px;  }
</style>
</head>

<body>

<h2>펌프 모니터링 시스템</h2>

<div id="status" class="error">연결 대기중...</div>
<div id="gpio" style="font-size:40px;margin-top:20px;">-</div>

<script>
// =====================
// MQTT 설정 (SUBSCRIBE 계정)
// =====================
const MQTT_URL  = "wss://8ec1da5a0b454c74ad3232327ead143a.s1.eu.hivemq.cloud:8884/mqtt";
const MQTT_USER = "esp32_2";
const MQTT_PASS = "1234qwerQWER";

// =====================
const statusEl = document.getElementById("status");
const gpioEl   = document.getElementById("gpio");

// =====================
// MQTT 연결
// =====================
const client = mqtt.connect(MQTT_URL, {
  username: MQTT_USER,
  password: MQTT_PASS,
  keepalive: 60,
  reconnectPeriod: 2000
});

client.on("connect", () => {
  client.subscribe("esp32/#");
});

// =====================
// 메시지 수신
// =====================
client.on("message", (topic, message) => {
  const val = message.toString();

  if (topic === "esp32/status") {
    if (val === "online") {
      statusEl.innerText = "정상 동작";
      statusEl.className = "online";
    } else {
      statusEl.innerText = "⚠ 모니터링 장치 OFF 및 고장";
      statusEl.className = "error";
    }
  }

  if (topic === "esp32/gpio/13") {
    gpioEl.innerText =
      (val === "1") ? "현재상태 : 펌프 꺼짐(OFF)" : "현재상태 : 펌프 켜짐(ON)";
  }
});
</script>

</body>
</html>
